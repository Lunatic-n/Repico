<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/main.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbf5fc">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app-container">

<header class="header">

    <h1 class="logo-area">
        <img class="logo-image" src="icons/logo.png">
    </h1>

    <div class="header-bar">

        <div class="header-buttons-left">

            <a href="info.html" class="icon-button help-button">
                <img src="icons/help.svg">
            </a>

            <a href="create.html" class="icon-button add-button">
                <img src="icons/add.svg">
            </a>

        </div>

        <div class="header-buttons-right">

            <button class="icon-button import-button" id="import-button">
                <span>📥</span>
            </button>

            <div class="sort-wrapper">
                <button class="icon-button sort-button" id="sort-button">
                    <img src="icons/sort.svg">
                </button>

                <div class="sort-menu" id="sort-menu">
                    <button type="button" class="sort-option" data-sort="newest">新しい順</button>
                    <button type="button" class="sort-option" data-sort="oldest">古い順</button>
                    <button type="button" class="sort-option" data-sort="title">タイトル順</button>
                </div>
            </div>

        </div>

    </div>

</header>

<section class="search-area">

    <div class="search-box">

        <img class="search-icon" src="icons/search.svg">

        <input class="search-input" type="text" placeholder="レシピを検索">

    </div>

</section>

<section class="recipe-summary">

    <p class="recipe-count">
        レシピ <span id="recipe-count-number">0</span>件
    </p>

</section>

<section class="recipe-list"></section>

</div>

<footer class="version-footer">
  © 2026 Repico 🍳 Version 
  <a href="update.html" id="version-link">1.1.2-Beta</a>
  <span class="update-dot" id="update-dot"></span>
  </a>
</footer>

<!-- インポート：ID入力モーダル -->
<div class="modal-overlay" id="import-modal">
    <div class="modal-box">
        <p class="modal-message">保存したいレシピのIDを入力してください</p>
        <input type="text" id="import-id-input" class="import-id-input" placeholder="共有ID">
        <p class="import-error" id="import-error" style="display:none;"></p>
        <div class="modal-buttons">
            <button type="button" class="modal-btn cancel" id="import-cancel">キャンセル</button>
            <button type="button" class="modal-btn ok" id="import-fetch-btn">インポート</button>
        </div>
    </div>
</div>

<!-- インポート：確認モーダル -->
<div class="modal-overlay" id="import-confirm-modal">
    <div class="modal-box">
        <p class="modal-message">このレシピを保存しますか？</p>
        <div class="import-preview">
            <img id="import-preview-thumb" class="import-preview-thumb" alt="">
            <div id="import-preview-title" class="import-preview-title"></div>
        </div>
        <div class="modal-buttons">
            <button type="button" class="modal-btn cancel" id="import-confirm-cancel">キャンセル</button>
            <button type="button" class="modal-btn ok" id="import-confirm-ok">保存する</button>
        </div>
    </div>
</div>

<!-- インポート：完了モーダル -->
<div class="modal-overlay" id="import-success-modal">
    <div class="modal-box">
        <p class="modal-message">保存しました</p>
        <div class="modal-buttons">
            <button type="button" class="modal-btn ok" id="import-success-ok">閉じる</button>
        </div>
    </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
  window.supabase = createClient(
    'https://suvpwczomnrxabyuzxre.supabase.co',
    'sb_publishable_3knqAD65Fsg66G6DBLtF-Q_0RKLXVp-'
  )
</script>

<script type="module" src="js/top.js"></script>

</body>
</html>
